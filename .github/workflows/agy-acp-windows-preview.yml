name: BaoCode Antigravity ACP Windows Preview
on:
  push:
    branches: [build/agy-acp-windows-preview]
  workflow_dispatch:
permissions:
  contents: read
env:
  SOURCE_SHA: b9b32dd1fd6b8f1379f06b9e7614ff5b25c16683
jobs:
  installer:
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v5
        with:
          repository: baocode-dev/baocode
          ref: "${{ env.SOURCE_SHA }}"
          persist-credentials: false
      - name: Verify pinned ACP source
        shell: pwsh
        run: |
          if ((git rev-parse HEAD).Trim() -ne $env:SOURCE_SHA) { throw 'Wrong source commit' }
          if (!(Select-String -Path lib/kernel/kernel_registry.dart -SimpleMatch AntigravityKernel -Quiet)) { throw 'Antigravity kernel missing' }
          if (!(Test-Path lib/kernel/acp/acp_connection.dart)) { throw 'ACP connection missing' }
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.5
      - uses: ./.github/actions/setup-rust
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Resolve dependencies
        run: flutter pub get
      - name: Test Antigravity kernel and runtime
        run: flutter test test/kernel/antigravity_kernel_test.dart test/kernel/agy_runtime_test.dart
      - name: Build Windows x64 installer
        run: dart run tool/build_windows.dart --arch x64 --remote-release 2.0.4.37-8c3ababc505d
      - name: Verify installer and write SHA-256
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -LiteralPath build/installers -File -Filter 'BaoCode-*-setup.exe')
          if ($files.Count -ne 1) { throw "Expected one installer, got $($files.Count)" }
          $out = New-Item -ItemType Directory -Path build/agy-acp-artifact -Force
          $name = 'BaoCode-2.0.4-agy-acp-preview-windows-x64-setup.exe'
          $target = Join-Path $out.FullName $name
          Copy-Item -LiteralPath $files[0].FullName -Destination $target
          $stream = [IO.File]::OpenRead($target)
          try {
            if ($stream.Length -lt 1MB -or $stream.ReadByte() -ne 77 -or $stream.ReadByte() -ne 90) { throw 'Invalid Windows installer' }
          } finally { $stream.Dispose() }
          $hash = (Get-FileHash -LiteralPath $target -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $name" | Set-Content -LiteralPath "$target.sha256" -Encoding ascii
          "$hash  $name" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
      - uses: actions/upload-artifact@v6
        with:
          name: baocode-agy-acp-preview-windows-x64
          path: build/agy-acp-artifact/
          if-no-files-found: error
          retention-days: 14
